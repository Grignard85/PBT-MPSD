<style>
/* ===== TEMA ceria ala "Petualangan Tanaman Seru" (terang & gelap) ===== */
:root{--bg:#ffefc2;--card:#fff8e1;--tx:#3a2a12;--mut:#7a6440;--pri:#4caf3a;--pri2:#2f7d22;--acc:#ffc928;--ok:#2e9e3a;--bad:#e5484d;--bd:#d9b66a;--edge:#5fae3a;--sh:0 6px 0 rgba(60,110,30,.45);--wood1:#b87333;--wood2:#8a4f1d;--ink:#6b3410;--dim:0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3d4630;--card:#2c3624;--tx:#fff6dc;--mut:#d3c8a0;--bd:#6f7d4c;--dim:.45}}
:root[data-theme=dark]{--bg:#3d4630;--card:#2c3624;--tx:#fff6dc;--mut:#d3c8a0;--bd:#6f7d4c;--dim:.45}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;font-family:"Fredoka","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--tx);line-height:1.55;font-size:18px;
  background:linear-gradient(rgba(0,20,40,var(--dim)),rgba(0,20,40,var(--dim))),var(--img-bg) center bottom/cover no-repeat fixed #7cc4f0}
/* karakter maskot di pojok bawah (hiasan, tidak bisa diklik) */
body::before,body::after{content:"";position:fixed;bottom:0;pointer-events:none;z-index:1;background-repeat:no-repeat;background-position:bottom;background-size:contain;animation:bob 3s ease-in-out infinite}
body::before{left:1%;width:clamp(70px,13vw,190px);height:clamp(90px,18vw,250px);background-image:var(--img-sun)}
body::after{right:1%;width:clamp(70px,13vw,190px);height:clamp(90px,18vw,250px);background-image:var(--img-cac);animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-8px)}}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 16px;position:sticky;top:0;z-index:5;
  background:linear-gradient(var(--wood1),var(--wood2));border-bottom:5px solid #4e2c0f;box-shadow:0 4px 10px rgba(0,0,0,.3)}
header h1{margin:0;font-size:1.35rem;cursor:pointer;color:#ffd23f;font-weight:700;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;color:#fff;background:#4caf3a;box-shadow:0 5px 0 #2f7d22;text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #2f7d22}
button.ghost{padding:8px 14px;background:#7c4dff;box-shadow:0 4px 0 #4a2fb0}
button.ghost.b2{background:#2196f3;box-shadow:0 4px 0 #0f5fa8}
button.ghost.b3{background:#e5484d;box-shadow:0 4px 0 #a3262a}
button.ghost.b4{background:#ff9800;box-shadow:0 4px 0 #b36200}
button.ghost.b5{background:#fff3d0;box-shadow:0 4px 0 #b89b55}
.vid{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;border:4px solid var(--edge);background:#000;margin:8px 0 14px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
button.alt{background:#ff9800;box-shadow:0 5px 0 #b36200}
button:disabled{opacity:.5;cursor:not-allowed}
main{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:18px 14px 150px}
h2{display:block;width:fit-content;max-width:100%;margin:6px auto 16px;padding:8px 26px;text-align:center;font-size:1.75rem;line-height:1.25;color:#ffd23f;border-radius:16px;
  background:linear-gradient(var(--wood1),var(--wood2));border:4px solid #5a300f;box-shadow:0 6px 0 #4e2c0f;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
h3{font-size:1.25rem;margin:.7em 0 .3em;color:var(--pri2)}
.card{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.topic{cursor:pointer;transition:transform .15s;margin:0}.topic:hover{transform:translateY(-4px) rotate(-.5deg)}
.topic:nth-child(4n+2){border-color:#9b6bff}.topic:nth-child(4n+3){border-color:#ff9f1c}.topic:nth-child(4n+4){border-color:#29a3ee}
.topic .ic{font-size:2.6rem}
.bar{height:14px;background:var(--bg);border:2px solid var(--bd);border-radius:10px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4caf3a,#ffc928);transition:width .4s}
.muted{color:var(--mut);font-size:.95rem}
.tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap;justify-content:center}
.tabs button{background:var(--card);color:var(--tx);box-shadow:0 5px 0 var(--bd);text-shadow:none}
.tabs button.on{background:#4caf3a;color:#fff;box-shadow:0 5px 0 #2f7d22;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;margin:12px 0}
.step{background:var(--bg);border:3px solid var(--bd);border-radius:18px;padding:12px;text-align:center;min-width:120px;flex:1;opacity:0;animation:pop .5s forwards}
.step .e{font-size:2.4rem;display:block}.step b{display:block;color:var(--pri2)}.step small{color:var(--mut)}
.arrow{align-self:center;font-size:1.6rem;color:#ff9800;opacity:0;animation:pop .5s forwards}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
ul.pts{padding-left:22px}ul.pts li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{background:var(--bg);color:var(--tx);border:3px solid var(--bd);box-shadow:0 4px 0 var(--bd);text-shadow:none}
.chip.sel{background:#ffc928;border-color:#d19a00;color:#3a2a12;box-shadow:0 4px 0 #d19a00}
.chip.done{background:#4caf3a;border-color:#2f7d22;color:#fff;box-shadow:0 4px 0 #2f7d22}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;font-weight:700;margin:8px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
/* pilihan kuis: hijau, ungu, biru, oranye seperti di PPT */
.opt{display:block;width:100%;text-align:left;margin:10px 0;background:#4caf3a;box-shadow:0 5px 0 #2f7d22}
.opt:nth-of-type(2){background:#8e5bea;box-shadow:0 5px 0 #5b2fb3}
.opt:nth-of-type(3){background:#2196f3;box-shadow:0 5px 0 #0f5fa8}
.opt:nth-of-type(4){background:#ff9800;box-shadow:0 5px 0 #b36200}
.opt.right{background:#2e9e3a!important;box-shadow:0 5px 0 #1b6a24!important;outline:4px solid #ffd23f}
.opt.wrong{background:#e5484d!important;box-shadow:0 5px 0 #a3262a!important;opacity:.85}
.expl{background:var(--bg);border-left:6px solid var(--acc);padding:10px 14px;border-radius:12px;margin:12px 0}
.fc{height:230px;perspective:900px;cursor:pointer;margin:14px 0}
.fc>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip>div{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1.25rem;border:5px solid var(--edge);background:var(--card);box-shadow:var(--sh)}
.fc .f{font-size:2.1rem;font-weight:700;color:var(--pri2)}.fc .b{transform:rotateY(180deg)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.big{font-size:3.4rem;font-weight:700;color:#ff9800;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.15)}
input.nm{font:inherit;padding:10px 14px;border-radius:14px;border:3px solid var(--bd);background:#fff;color:#3a2a12;margin:4px;width:min(260px,100%)}
@media(max-width:560px){body{font-size:16px}h2{font-size:1.3rem;padding:6px 16px}header h1{font-size:1rem}main{padding-bottom:130px}button{padding:9px 14px}}
</style>
</head>

<header>
  <h1 onclick="go('home')">🌱 Petualangan Tanaman Seru</h1>
  <nav>
    <button class="ghost" onclick="go('home')">Beranda</button>
    <button class="ghost b2" onclick="go('cards')">Flashcard</button>
    <button class="ghost b3" onclick="go('video')">🎬 Video</button>

    <button class="ghost b5" id="themeBtn" onclick="toggleTheme()" aria-label="Ganti tema">🌓</button>
  </nav>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   DATA MATERI — edit isi di bagian ini saja (sumber: PPT "Petualangan Tanaman Seru")
   Tipe simulasi: "sort" (kelompokkan ke kategori) | "order" (urutkan langkah)
   ===================================================================== */
const TOPICS = [
 { id:"dasar", icon:"🌿", title:"Dua Cara Berkembang Biak",
   intro:"Perkembangbiakan adalah cara tumbuhan membuat tumbuhan baru supaya jenisnya tidak punah. Ada dua cara utama.",
   flow:[{e:"🌸",t:"Generatif",s:"Lewat biji"},{e:"🌱",t:"Vegetatif",s:"Tanpa biji"}],
   points:["Generatif: tumbuhan baru berasal dari biji hasil penyerbukan dan pembuahan pada bunga.","Vegetatif: tumbuhan baru tumbuh dari bagian tubuh induk (akar, batang, daun, atau tunas).","Vegetatif bisa terjadi alami, atau dibantu manusia (buatan)."],

/* ---- Simulasi ---- */
let SIM={};
function sim(t){
  const s=t.sim;
  SIM=s.type==="sort"?{sel:null,done:new Set(),items:shuffle(s.items.map((x,i)=>[...x,i]))}:{n:0,steps:shuffle(s.steps.map((x,i)=>[x,i])),done:new Set()};
  drawSim();
}
function drawSim(msg="",cls=""){
  const s=TOPICS[S.t].sim; let h=`<div class="card"><p><b>${s.prompt}</b></p>`;
  if(s.type==="sort"){
    h+=`<p class="muted">1) Ketuk contoh, 2) ketuk kategori tujuannya.</p><div class="chips">`+
    SIM.items.filter(x=>!SIM.done.has(x[2])).map(x=>`<button class="chip ${SIM.sel===x[2]?'sel':''}" onclick="selItem(${x[2]})">${x[0]}</button>`).join("")+`</div>
    <div class="row">${s.cats.map(c=>`<button class="alt" onclick="dropCat('${c}')">${c} (${[...SIM.done].filter(i=>s.items[i][1]===c).length})</button>`).join("")}</div>`;
  } else {
    h+=`<div class="chips">`+SIM.steps.map(x=>`<button class="chip ${SIM.done.has(x[1])?'done':''}" ${SIM.done.has(x[1])?'disabled':''} onclick="pickStep(${x[1]})">${SIM.done.has(x[1])?(x[1]+1)+'. ':''}${x[0]}</button>`).join("")+`</div>`;
  }
  const total=s.type==="sort"?s.items.length:s.steps.length, fin=SIM.done.size===total;
  h+=`<div class="fb ${cls}" id="fb">${fin?"🎉 Hebat! Simulasi selesai.":msg}</div>
  <div class="row"><button class="alt" onclick="sim(TOPICS[S.t])">🔄 Ulangi</button>${fin?'<button onclick="S.tab=\'kuis\';render()">Lanjut ke Kuis →</button>':''}</div></div>`;
  if(fin)S.prog[S.t].s=true;
  $("body").innerHTML=h;
}
function selItem(i){SIM.sel=i;drawSim("Sekarang ketuk kategorinya.")}
function dropCat(c){
  const s=TOPICS[S.t].sim; if(SIM.sel===null)return drawSim("Pilih satu contoh dulu ya.","no");
  if(s.items[SIM.sel][1]===c){SIM.done.add(SIM.sel);SIM.sel=null;sfx("ok");drawSim("✅ Benar!","ok")}
  else{sfx("no");drawSim("❌ Belum tepat, coba kategori lain.","no");$("fb").classList.add("shake")}
}
function pickStep(i){
  if(i===SIM.n){SIM.done.add(i);SIM.n++;sfx("ok");drawSim("✅ Tepat!","ok")}
  else{sfx("no");drawSim("❌ Bukan langkah itu. Cari langkah ke-"+(SIM.n+1)+".","no");$("fb").classList.add("shake")}
}

/* =====================================================================
   SUARA — musik latar ceria (nada dibuat langsung oleh browser, tanpa file audio)
   + efek benar/salah. Musik mulai setelah anak mengetuk layar pertama kali
   (aturan browser) dan bisa dimatikan lewat tombol 🎵.
   Ubah MELODI / BASS / TEMPO di bawah kalau ingin lagu lain (angka = nomor nada MIDI, 0 = diam).
   ===================================================================== */
const TEMPO=128;                                   // ketukan per menit
const MELODI=[72,76,79,76,72,76,79,0,  69,72,76,72,69,72,76,0,  72,77,81,77,72,77,79,0,  71,74,79,74,72,0,67,0]; // 4 birama x 8 nada
const BASS=[48,45,41,43];                          // akar tiap birama (C, Am, F, G)
const M={on:true,ctx:null,timer:null,step:0,next:0,started:false};
const hz=n=>440*Math.pow(2,(n-69)/12);
function audio(){
  if(!M.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    M.ctx=new C();M.out=M.ctx.createGain();M.out.gain.value=.55;M.out.connect(M.ctx.destination)}
  return M.ctx;
}
function tone(f,t,d,type,v){
  const c=M.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(M.out);o.start(t);o.stop(t+d+.05);
}
function schedule(){
  const c=M.ctx,len=60/TEMPO/2;                    // panjang 1 nada (1/8)
  while(M.next<c.currentTime+.3){
    const i=M.step%32,bar=Math.floor(i/8),k=i%8,t=M.next;
    if(MELODI[i])tone(hz(MELODI[i]),t,len*1.6,"triangle",.17);
    if(k===0||k===4)tone(hz(BASS[bar]),t,len*2.5,"sine",.22);
    if(k===2||k===6)tone(hz(BASS[bar]+7),t,len*1.2,"sine",.1);
    if(k%2===1)tone(6000,t,.03,"square",.012);     // "tik" ceria
    M.next+=len;M.step++;
  }
}
function musicStart(){
  const c=audio();if(!c||!M.on)return;
  c.resume();if(M.timer)return;
  M.next=c.currentTime+.05;M.timer=setInterval(schedule,60);
}
function musicStop(){if(M.timer){clearInterval(M.timer);M.timer=null}if(M.ctx)M.ctx.suspend()}
function musicSync(){                               // dipanggil tiap pindah halaman
  if(!M.started)return;
  if(M.on&&S.view!=="video"&&!document.hidden)musicStart();else musicStop();
}
function sfx(kind){
  const c=M.on&&audio();if(!c)return;c.resume();const t=c.currentTime+.01;
  if(kind==="ok")[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.25,"triangle",.25));
  else{tone(220,t,.25,"sawtooth",.1);tone(165,t+.12,.3,"sawtooth",.1)}
}
function paintSound(){$("soundBtn").textContent=M.on?"🎵":"🔇"}
function toggleSound(){M.on=!M.on;M.started=true;paintSound();musicSync()}
addEventListener("pointerdown",()=>{if(!M.started){M.started=true;musicSync()}},{once:true});
document.addEventListener("visibilitychange",musicSync);
paintSound();
render();
</script>
</body>
